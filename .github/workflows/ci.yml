name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run mypy src

  dbt-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --dev --group transform
      - run: uv run dbt deps --project-dir dbt/
      - run: uv run sqlfluff lint dbt/
        env:
          DBT_TARGET: ci

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --dev --group transform
      - run: uv run dbt deps --project-dir dbt/
      - run: uv run pytest --ignore=tests/airflow

  airflow-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build Airflow test image
        run: docker build --target test -t ecommerce-airflow-test .

      - name: Run Airflow tests
        run: docker run --rm ecommerce-airflow-test
