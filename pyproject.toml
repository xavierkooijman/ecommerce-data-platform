[project]
name = "ecommerce-data-platform"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "sqlfluff>=4.4.0",
    "sqlfluff-templater-dbt>=4.4.0",
    "testcontainers[postgres]>=4.15.0",
]
transform = [
    "dbt-core>=1.12.5",
    "dbt-postgres>=1.11.0",
]

[tool.uv]
  default-groups = ["dev", "transform"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
mypy_path = "src"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pytest.ini_options]
addopts = "--ignore=tests/airflow"
