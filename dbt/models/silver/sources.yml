version: 2

sources:
  - name: bronze
    schema: bronze
    description: "Raw landing tables containing source records stored as JSONB."

    tables:
      - name: customers
        description: "Raw customer records ingested from the source database."
        columns:
          - name: ingestion_id
            description: "Unique identifier assigned when the record is ingested into Bronze."
            tests:
              - not_null
              - unique
          
          - name: ingested_at
            description: "Timestamp when the record was written to Bronze."
            tests:
              - not_null

          - name: payload
            description: "Raw source record stored as JSONB."
            tests:
              - not_null
      
      - name: products
        description: "Raw product records ingested from the source database."
        columns:
          - name: ingestion_id
            description: "Unique identifier assigned when the record is ingested into Bronze."
            tests:
              - not_null
              - unique
          
          - name: ingested_at
            description: "Timestamp when the record was written to Bronze."
            tests:
              - not_null

          - name: payload
            description: "Raw source record stored as JSONB."
            tests:
              - not_null

      - name: orders
        description: "Raw order records ingested from the source database."
        columns:
          - name: ingestion_id
            description: "Unique identifier assigned when the record is ingested into Bronze."
            tests:
              - not_null
              - unique
          
          - name: ingested_at
            description: "Timestamp when the record was written to Bronze."
            tests:
              - not_null

          - name: payload
            description: "Raw source record stored as JSONB."
            tests:
              - not_null

      - name: order_items
        description: "Raw order item records ingested from the source database."
        columns:
          - name: ingestion_id
            description: "Unique identifier assigned when the record is ingested into Bronze."
            tests:
              - not_null
                        
          - name: ingested_at
            description: "Timestamp when the record was written to Bronze."
            tests:
              - not_null

          - name: payload
            description: "Raw source record stored as JSONB."
            tests:
              - not_null

      - name: shipments
        description: "Raw shipment records ingested from the source database."
        columns:
          - name: ingestion_id
            description: "Unique identifier assigned when the record is ingested into Bronze."
            tests:
              - not_null
              - unique
          
          - name: ingested_at
            description: "Timestamp when the record was written to Bronze."
            tests:
              - not_null

          - name: payload
            description: "Raw source record stored as JSONB."
            tests:
              - not_null

  - name: meta
    schema: meta
    description: "Metadata tables containing information about the ingestion process."
    tables:
      - name: quarantine
        description: "References of records that failed validation"
        columns:
          - name: quarantine_id
            description: "Unique identifier assigned when the record is quarantined."
            tests:
              - not_null
              - unique
          - name: source_table
            description: "The source table from which the record originated."
            tests:
              - not_null
          - name: ingestion_id
            description: "The ingestion_id of the record that was quarantined."
            tests:
              - not_null
              - unique
          - name: source_pk
            description: "The primary key of the record in the source table."
            tests:
              - not_null
          - name: errors
            description: "JSON of error messages describing why the record was quarantined."
            tests:
              - not_null
          - name: status
            description: "The status of the quarantined record"
            tests:
              - not_null
          - name: quarantined_at
            description: "Timestamp when the record was quarantined."
            tests:
              - not_null
          - name: resolved_at
            description: "Timestamp when the record was resolved."