models:
  - name: dim_date
    description: "Date dimension"
    columns:
      - name: date_sk
        description: "Integer date key in YYYYMMDD format."
        tests:
          - unique
          - not_null

      - name: full_date
        description: "Calendar date, one row per date."
        tests:
          - unique
          - not_null

      - name: day_of_month
        description: "Day of the month"
        tests:
          - not_null

      - name: day_of_week
        description: "Day of the week"
        tests:
          - not_null

      - name: month_number
        description: "Month number"
        tests:
          - not_null

      - name: quarter
        description: "Quarter of the year"
        tests:
          - not_null

      - name: calendar_year
        description: "Calendar year."
        tests:
          - not_null

      - name: is_weekend
        description: "Whether the date falls on Saturday or Sunday."
        tests:
          - not_null